site_name: June's IoT Portfolio
site_description: An Embedded Systems Field Journal — organized by theme, not by week.
site_author: Kibuku Carole June Wanjiku

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Literata              # Warm editorial serif for body copy
    code: Space Mono             # Typewriter-style mono for code blocks
  features:
    - navigation.tabs           # Creates top-level navigation (one tab per theme)
    - navigation.tabs.sticky
    - navigation.indexes
    - content.code.copy         # Adds a copy button to your code blocks
    - content.code.annotate      # Allows you to add inline notes to code

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list                   # Lets us add classes (e.g. for the week-tag stamps)
  - md_in_html

# Navigation Section — grouped by theme/topic instead of by week
nav:
  - Home: index.md
  - Foundations:
    - Overview: foundations/portfolio-setup.md
    - Hardware Fundamentals: foundations/hardware-fundamentals.md
    - Architecture & Bare Metal: foundations/architecture-bare-metal.md
    - Version Control: foundations/version-control.md
  - Code & Logic:
    - OOP Shapes (Python): code-and-logic/oop-shapes-python.md
    - C Fundamentals: code-and-logic/c-fundamentals.md
    - Modular C & Compilation: code-and-logic/modular-c-compilation.md
    - Data Structures & Memory: code-and-logic/data-structures-memory.md
  - Inputs & Control:
    - Buttons & State Logic: inputs-and-control/buttons-state-logic.md
    - Traffic Light Controller: inputs-and-control/traffic-light-controller.md
  - Sensing the World:
    - DHT22 Temp & Humidity: sensing-the-world/dht22-temperature-humidity.md
    - Ultrasonic Distance: sensing-the-world/ultrasonic-distance.md
  - Going Wireless:
    - Serial Protocols (SPI/UART/I2C): going-wireless/serial-protocols.md
    - Pico W & Wi-Fi Init: going-wireless/picow-wifi-init.md
  - Capstone Project:
    - Attendace Tracker: capstone/attendance.md
    - Tracker Code: capstone/attendance-code.md

# Style Section
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
